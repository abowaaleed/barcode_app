<!DOCTYPE html>
<html dir="rtl">
<head>
  <base href="/barcode_app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مولّد الباركود الذكي v1.3.0 - إنشاء رموز QR احترافية">

  <!-- Cache busting -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مولّد الباركود">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">

  <title>مولّد الباركود الذكي v1.3.0</title>
  <link rel="manifest" href="manifest.json?v=1.3.0">
  <style>
    body { margin: 0; padding: 0; }
    #loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; font-family: 'Cairo', sans-serif; color: #6C63FF;
      background: #f5f7fa;
    }
    #loading .spinner {
      width: 48px; height: 48px; margin-bottom: 16px;
      border: 4px solid #e0e3ff; border-top-color: #6C63FF;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .app-name { font-size: 18px; font-weight: 700; color: #2D3142; }
    #error-container {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #f8f9ff; z-index: 9999;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; direction: rtl;
    }
    #error-container h2 { color: #EF5350; margin-bottom: 8px; }
    #error-container p { color: #666; font-size: 14px; margin-bottom: 16px; }
    #error-container button {
      background: #6C63FF; color: white; border: none;
      padding: 12px 28px; border-radius: 10px; cursor: pointer;
      font-size: 15px; font-family: inherit;
    }
    #error-detail { font-size: 11px; color: #999; margin-top: 16px; max-width: 400px; word-break: break-word; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="app-name">مولّد الباركود الذكي</div>
    <div style="font-size:12px;color:#9C9EB9;margin-top:4px;">v1.3.0</div>
  </div>
  <div id="error-container">
    <div style="font-size:48px;margin-bottom:8px;">⚠️</div>
    <h2>عذراً، حدث خطأ في تحميل التطبيق</h2>
    <p>يرجى تحديث الصفحة أو المحاولة لاحقاً</p>
    <button onclick="location.reload()">تحديث الصفحة</button>
    <div id="error-detail"></div>
  </div>
  <script>
    setTimeout(function() {
      var el = document.getElementById('loading');
      var err = document.getElementById('error-container');
      if (el && el.style.display !== 'none') {
        err.style.display = 'flex';
        err.querySelector('#error-detail').textContent = 'انتهت مهلة التحميل. قد يكون التطبيق بحاجة إلى تحديث.';
      }
    }, 60000);
    window.addEventListener('error', function(e) {
      var err = document.getElementById('error-container');
      if (err) {
        err.style.display = 'flex';
        err.querySelector('#error-detail').textContent = e.message || e.error || 'خطأ غير معروف';
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=4" async></script>
</body>
</html>
