<!DOCTYPE html>
<html dir="rtl">
<head>
  <base href="/barcode_app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مولّد الباركود الذكي - إنشاء رموز QR احترافية">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مولّد الباركود">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">

  <title>مولّد الباركود الذكي</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; padding: 0; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: sans-serif; color: #6C63FF;
    }
    #error {
      display: none; align-items: center; justify-content: center;
      height: 100vh; font-family: sans-serif; color: #FF6B6B;
      padding: 20px; text-align: center; flex-direction: column;
    }
    #error.show { display: flex; }
    #loading.hidden { display: none; }
  </style>
  <script>
    setTimeout(function() {
      var loading = document.getElementById('loading');
      var error = document.getElementById('error');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        error.classList.add('show');
      }
    }, 15000);
  </script>
</head>
<body>
  <div id="loading">جاري التحميل...</div>
  <div id="error">
    <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
    <div style="font-size:18px;font-weight:bold;">عذراً، حدث خطأ في تحميل التطبيق</div>
    <div style="font-size:14px;margin-top:8px;color:#999;">
      يرجى تحديث الصفحة أو المحاولة لاحقاً<br>
      <span id="errorDetail" style="font-size:12px;"></span>
    </div>
    <button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#6C63FF;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;">
      تحديث الصفحة
    </button>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('errorDetail').textContent = e.message || 'خطأ غير معروف';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('errorDetail').textContent = e.reason && e.reason.message ? e.reason.message : 'Promise rejected';
    });
  </script>
  <script src="flutter_bootstrap.js?v=3" async></script>
</body>
</html>
